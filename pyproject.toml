[project]
name = "terminaltreeview"
version = "0.4.0"
description = "An interactive terminal directory navigator for Windows."
authors = [
    { name = "FlipNeves" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["terminal", "tui", "directory", "navigator", "windows", "cd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/FlipNeves/terminalTreeView"
Repository = "https://github.com/FlipNeves/terminalTreeView"

[project.scripts]
ttv-tool = "terminaltreeview.app:main"
ttv-setup = "terminaltreeview.setup:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
